timezone: Europe/Amsterdam

# Action when no rule below matches.
default: deny

# Rules are evaluated top to bottom and the last match wins, so broad allows
# go first and narrower denies are layered after them.
rules:
  # Deploying is fine during office hours on a weekday...
  - name: office-hours
    action: allow
    time_intervals:
      - weekdays: ['monday:friday']
        times: [{ start_time: '09:00', end_time: '18:00' }]

  # ...except that Friday afternoon is too late to babysit a rollback.
  - name: friday-afternoon
    action: deny
    time_intervals:
      - weekdays: ['friday']
        times: [{ start_time: '14:00', end_time: '24:00' }]

  # Nothing ships over the Christmas break.
  - name: christmas-freeze
    action: deny
    time_intervals:
      - months: ['december']
        days_of_month: ['22:31']
      - months: ['january']
        days_of_month: ['1:2']
