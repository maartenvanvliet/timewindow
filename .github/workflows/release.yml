name: release

# Push a tag to release:
#
#   git tag -a v1.0.0 -m v1.0.0 && git push origin v1.0.0
#
# Or run this workflow from the Actions tab and pick a bump level, and it
# works out the next version and tags it for you.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version to tag instead, e.g. v1.4.0 (overrides the bump)
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -race -cover

      # Only when started from the Actions tab: a pushed tag is already here.
      # The tag is created on this commit and pushed before GoReleaser runs,
      # so both entry points leave GoReleaser looking at a tagged HEAD.
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT" ]; then
            version=$EXPLICIT
          else
            version=$(./script/next-version.sh "$BUMP")
          fi

          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a vMAJOR.MINOR.PATCH version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::tag $version already exists"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "$version"
          git push origin "$version"

          echo "::notice::tagged $version"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
