name: release

# Two ways in, one release path:
#
#   * Run this workflow from the Actions tab and pick a bump level. It works
#     out the next version, tags it and releases it.
#   * Or push a tag yourself (git tag -a v1.0.0 -m v1.0.0 && git push origin
#     v1.0.0) and it releases that.
#
# A tag with a prerelease suffix (v1.0.0-rc.1) is published as a pre-release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version to tag instead, e.g. v1.4.0 (overrides the bump)
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history and every tag to build a
          # changelog, and next-version.sh needs the tags to count from.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # Nothing gets tagged or published from a red tree.
      - name: Check
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
          go vet ./...
          go test ./...

      # Only when started from the Actions tab: a pushed tag is already here.
      # The tag is created on this commit and pushed before GoReleaser runs,
      # so both entry points leave GoReleaser looking at a tagged HEAD.
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT" ]; then
            version=$EXPLICIT
          else
            version=$(./script/next-version.sh "$BUMP")
          fi

          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a vMAJOR.MINOR.PATCH version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::tag $version already exists"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "$version"
          git push origin "$version"

          echo "::notice::tagged $version"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
